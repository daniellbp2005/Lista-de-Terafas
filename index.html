<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="conteiner">
        <div class="cima">
            <h1>Coloque sua Tarefa <span id="contador">0</span>🔥</h1>
            <div class="linha">
                <input type="text" id="inputTarefa" placeholder="Digite:">
                <button id="btn">Enviar</button>
            </div>
        </div>
        <div class="baixo">
            <ul id="underList">

            </ul>
            <p id="aviso"><u>Organze Mais seu dia</u></p>
        </div>
    </div>
</body>

</html>
